name: Focused checks

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - name: Check Go formatting without modifying source
        run: test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
      - name: Check release tooling contracts
        run: python3 -B -P -m unittest discover -s scripts -p release_test.py
      - name: Vet and lint controller and shared identity/time boundaries
        run: |
          go vet ./cmd/stackd ./clock ./iam/policy ./internal/identity ./compute/lambda/cmd/telemetry-buffer
          go tool staticcheck ./cmd/stackd ./clock ./iam/policy ./internal/identity ./compute/lambda/cmd/telemetry-buffer
      - name: Run focused identity/time policy tests
        run: go test -race -timeout 10m ./clock ./iam/policy ./internal/identity
      - name: Build native CLI and both static Linux telemetry helpers
        run: make build
      - name: Exercise focused deployment and encryption regressions
        run: |
          go test ./integration -timeout 10m -run '^(TestDefaultAccountIdentitySDK|TestCustomStorageRequiresAccountSelection|TestCloudFormationDeleteFirstReplacementRollback|TestCloudFormationRejectedExclusiveReplacementRestoresFreshNativeOwner|TestCloudFormationQueuePublicEndpoint|TestRESTResponseLifecycle|TestS3UpdateObjectEncryption.*|TestCloudFormationSecureDynamicReferencesNativePasswordReplay|TestCloudFormationSecretJSONKeyNativeCoercion|TestCloudFormationSecureResultAttributesRejectConsumption)$'
          go test ./storage ./storage/sqlite -timeout 5m -run '^(TestMemoryAccountSelection.*|TestSQLiteAccountSelection.*|TestCloudFormationSecureDynamicReferencePinMigration)$'
          go test ./internal/services/athena -timeout 5m
          go test -race ./internal/services/cloudformation -timeout 5m
          go test ./internal/services/rds ./storage/sqlite/rds ./cmd/terraformapisgen -timeout 5m
          go test -race ./internal/services/ec2 -timeout 5m -run '^TestEIPAttributesSDK'
          go test -race ./internal/integrations -timeout 5m -run '^(TestAthenaManifestRecordsOnlySuccessfulCommittedObjects|TestCFNSSOInstanceAndPermissionSetPrivateClaimsRejectCounterfeitAndForeignRecreation|TestCFNSSOPermissionSetUpdateOmitsAbsentNativeOptionalFields)$'
          go test ./internal/services/glue -timeout 5m -run '^TestTableStatisticsDeletionNativeIdempotence$'
      - name: Check native ownership and shared Iceberg metadata
        run: |
          go test -race -timeout 10m ./compute/eks ./compute/elbv2 ./engine/rds ./engine/athena ./internal/services/glue/icebergmeta
          go test -race -timeout 10m . -run '^Test(GlueIcebergREST|S3Tables)'
          go test -race -timeout 10m ./internal/services/s3tables ./storage/s3tables ./storage/sqlite/s3tables
          go test -race -timeout 10m ./internal/services/glue -run '^Test(S3TablesFederation|IcebergCommitReauthorizes|GluePartitionFilters)'
          go test -race -timeout 5m ./internal/services/athena -run '^TestCTASDestinationEnforcement'
      - name: Check scoped authorization, reporting and SQLite boundaries
        run: |
          go test -race -timeout 10m ./internal/awsapi ./internal/services/iam ./internal/services/cloudtrail
          go test -race -timeout 5m ./storage/sqlite ./storage/sqlite/iam ./storage/sqlite/backends ./internal/apievents -run '^(TestWaitingTransactionHonorsCancellation|TestCanceledTransactionJoinsRollbackBeforeClose|TestWALLanes.*|TestOutcomeGroup.*|TestGroupedRecorder.*|TestUserIDExistsUsesScopedImmutableIdentity|TestHotRepositor.*|TestS3PrefixQueriesSeekBoundedBinaryKeyRanges)$'
          go test -race -timeout 5m ./storage/s3 -run '^TestUTF8PrefixRangesPreserveAllListingCursors$'
          go test -race -timeout 10m ./integration -run '^(TestECRKubeletProviderTLSCurrentIAMAndRefresh|TestS3RangeUsesCurrentIdentityPolicySnapshot|TestActivityRecordsActualSQSAndKMSAttempts|TestActivityCrossAccountResourceUsesCallerScope|TestAssumedRoleEnforcesTrustSessionAndCurrentPolicies|TestFederationRequiresSessionPolicyAndRemainsRestricted|TestS3NativeVersionLifecycleReplay|TestS3MultipartNativeRawReplay|TestS3NativeBinarySDKReplay)$'
      - name: Check VPC Flow Logs controls, persistence and delivery authority
        run: |
          go test -race -timeout 10m ./compute/network
          go test -race -timeout 10m ./internal/services/ec2 ./internal/integrations ./integration -run 'FlowLog|FlowCapture|FlowReceiver'
          # Historical migration replay is serial SQL, not a Go concurrency boundary.
          go test -timeout 5m ./storage/sqlite/ec2 -run FlowLog

  fixture-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - name: Check explicit fixture identity and durable credential recovery
        run: |
          go test -race -p 2 ./integration -timeout 15m -run '^(TestKMSImportedMultiRegionStorageRotationAndExpiry|TestKMSAcceptedImportRotationCanUseReplacementMaterial|TestKMSMultiRegionCryptoRotationPromotionAndRecovery|TestKMSJobsSDK.*|TestInjectedStoragePreservesCrossServiceState|TestAccessKeyEventsSDK.*|TestAccountRegionEligibilityUsesCredentialAuthorityState)$'
      - name: Check authority failure injection and publication locking
        run: |
          go test -race -p 2 ./integration -timeout 15m -run '^(TestSigned(MFACodeStorageFailure|SessionAuthoritySDK.*|SessionKeepsOrganizationControlsUntilPublication)|TestMFAAttemptTransactionFailures|TestOutboundIdentityRevalidatesBeforePublishing|TestRootAccessFeaturesRollbackWithIAMAuthoritySDK|TestSTSTokenPreferenceReadsCurrentIssuanceTransaction|TestCloudTrailSTSFailedAuditRollsBackIssuedCredential|TestSessionEventFailureRollsBackCredentialSDK)$'
      - name: Check native account principals and retained confirmation replay
        run: |
          go test -race -p 2 ./integration -timeout 15m -run '^(TestEventBridgeNativeBusTargetsSDK|TestSNSHTTPNativeLifecycleAndRetainedDelivery)$'
      - name: Check real migration history
        # Ordered historical SQL replay is not a Go concurrency boundary.
        run: go test ./storage/sqlite/mq -timeout 5m -run '^TestLegacyBrokerUserMigrationRetainsNativeIdentity$'
      - name: Check current owners and asynchronous commit boundaries
        run: |
          go test -race -p 2 ./storage/sqlite/apigatewayv2 ./internal/services/cloudwatch ./internal/services/ssmmessages ./internal/services/glue ./internal/integrations -timeout 15m -run '^(TestAPIGatewayV2IncarnationRecoveryAndFencing|TestCloudFormationDashboardNativeUpdateAndRecreation|TestSignedScopeRejectsSpoofedIdentityAndTampering|TestPostDialTokenOneUseExpiryAndScope|TestReconnectFencesOldDeliveryAndRetainsMessageID|TestReplyAckOnlyAfterCommitAndTelemetryIsNotCommandSuccess|TestCommitFailureAndRevocationNeverAcknowledgeReply|TestCloseJoinsPendingAndSubscribedConnections|TestCrawlerActualObjectsRestartFailureAndCancellation|TestCrawlerSchedulePersistsAndStops|TestCFNEC2Volume(PrivateNativeOwnership|DeletionSnapshotPrivateReceipt|RejectsInstanceIntentAfterIAM)|TestCloudFormationStackNativeOwnershipRecoveryAndIsolation)$'

  applications:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          # Keep provider installs separate from the focused job's race-build cache.
          cache: false
      - name: Build native CLI for application checks
        run: go build -o bin/stackd ./cmd/stackd
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.9'
          terraform_wrapper: false
      - name: Exercise actual Terraform and CloudFormation applications
        run: |
          python3 -m venv "$RUNNER_TEMP/examples-venv"
          "$RUNNER_TEMP/examples-venv/bin/pip" install -r examples/requirements.txt
          mkdir -p "$RUNNER_TEMP/stackd-examples"
          "$RUNNER_TEMP/examples-venv/bin/python" examples/cloudformation/run.py --work-parent "$RUNNER_TEMP/stackd-examples"
          "$RUNNER_TEMP/examples-venv/bin/python" examples/terraform/run.py --work-parent "$RUNNER_TEMP/stackd-examples"
          "$RUNNER_TEMP/examples-venv/bin/python" examples/terraform-eip/run.py --work-parent "$RUNNER_TEMP/stackd-examples"
      - name: Retain example controller diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-controller-logs
          path: ${{ runner.temp }}/stackd-examples/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  generated:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - name: Read pinned GuardDuty catalog revision
        id: catalog
        run: echo "revision=$(jq -r .provenance.revision docs/guardduty-findings.json)" >> "$GITHUB_OUTPUT"
      - name: Fetch the exact catalog input (not runtime code)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: trustoncloud/aws-guardduty-findings-directory
          ref: ${{ steps.catalog.outputs.revision }}
          path: clones/aws-guardduty-findings-directory
          persist-credentials: false
      - name: Verify catalog input checksum
        run: |
          jq -r '"\(.provenance.source_sha256)  clones/aws-guardduty-findings-directory/findings.json"' docs/guardduty-findings.json | sha256sum --check -
      - name: Read pinned Terraform provider revision
        id: provider
        run: echo "revision=$(jq -r .provider.revision docs/terraform-provider-apis.json)" >> "$GITHUB_OUTPUT"
      - name: Fetch the exact Terraform provider source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: hashicorp/terraform-provider-aws
          ref: ${{ steps.provider.outputs.revision }}
          path: clones/terraform-provider-aws
          persist-credentials: false
      - name: Check retained and pinned-source generators
        run: |
          make generate-iam-check generate-oidc-check generate-simulation-check \
            generate-lambda-runtime-check generate-sql-check generate-mq-schema-check \
            generate-cloudformation-check generate-guardduty-findings-check \
            generate-terraform-apis-check

  native-flow-logs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.9'
          terraform_wrapper: false
      - name: Prepare pinned native receiver and consumer
        run: |
          docker pull nicolaka/netshoot@sha256:47b907d662d139d1e2f22bfe14f4efca1e3f1feed283572f47c970c780c03b61
          go build -o bin/stackd ./cmd/stackd
          python3 -m venv "$RUNNER_TEMP/flow-venv"
          "$RUNNER_TEMP/flow-venv/bin/pip" install -r examples/requirements.txt
      - name: Exercise receiver replay, revision upgrade and native policy verdicts
        env:
          STACKD_NETWORK_DOCKER: '1'
        run: go test ./compute/network -count=1 -timeout 10m -run '^(TestFlowCollectorDockerNativeReplay|TestDaemonFlowPolicyActualAdmissionAndTerminalRejection|TestDaemonPodRoutePacketPathAndWithdrawal|TestNativeNetworkLockRestrictiveUmask)$'
      - name: Exercise Terraform UDP/TCP traffic, native paths and both S3 formats
        run: |
          "$RUNNER_TEMP/flow-venv/bin/python" scripts/native/vpc_flow_logs.py \
            --binary bin/stackd \
            --state-directory "$RUNNER_TEMP/flow-evidence" \
            --image nicolaka/netshoot@sha256:47b907d662d139d1e2f22bfe14f4efca1e3f1feed283572f47c970c780c03b61 \
            --remove-owned-capture
      - name: Retain native flow evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-flow-logs
          path: |
            ${{ runner.temp }}/flow-evidence/report.json
            ${{ runner.temp }}/flow-evidence/**/*.log
            ${{ runner.temp }}/flow-evidence/s3/*.log.gz
            ${{ runner.temp }}/flow-evidence/s3/*.log.parquet
          if-no-files-found: ignore
          retention-days: 7

  native-analytics:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - name: Prepare pinned native SQL and Hive parser images
        run: |
          docker pull trinodb/trino@sha256:00125e40d063bc4816d165482f6044872b18b56026fb959d3b28ce1f96ffbbee
          docker pull apache/spark@sha256:9b0a6c2c860f5e7d18dd5270286fef32a09c7f5a7e2b0dbe5642de8a3a02ab3e
          go build -o bin/stackd ./cmd/stackd
          python3 -m venv "$RUNNER_TEMP/analytics-venv"
          "$RUNNER_TEMP/analytics-venv/bin/pip" install \
            'boto3==1.43.123' 'pyiceberg[pyarrow,glue]==0.10.0' 'pyarrow==26.0.1'
      - name: Exercise real warm SQL ownership and native SQL parsers
        env:
          STACKD_ATHENA_NETWORK_DOCKER_HOST: unix:///var/run/docker.sock
        run: go test ./engine/athena -count=1 -timeout 15m -run '^(TestDockerNetworkNative|TestWarmEngineNativeLifecycle|TestHiveDDLNativeFamilies|TestCTASParserNative)$' -v
      - name: Exercise native Hive, ordinary Iceberg and managed catalogs
        run: |
          "$RUNNER_TEMP/analytics-venv/bin/python" scripts/aws/analytics_native_smoke.py \
            --binary bin/stackd \
            --state-directory "$RUNNER_TEMP/analytics-private" \
            --output "$RUNNER_TEMP/analytics-result.json"
      - name: Retain public-safe native analytics assertions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-analytics
          path: ${{ runner.temp }}/analytics-result.json
          if-no-files-found: ignore
          retention-days: 7

  native-ingress:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - name: Prepare native ingress tools and immutable images
        run: |
          command -v aws kubectl helm dig openssl
          mkdir -p bin
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64 \
            --output bin/k3d
          echo 'dbaa79a76ace7f4ca230a1ff41dc7d8a5036a8ad0309e9c54f9bf3836dbe853e  bin/k3d' | sha256sum --check -
          chmod 0755 bin/k3d
          docker pull rancher/k3s:v1.33.5-k3s1@sha256:fd4740667b7033055c27d424d0d2d660bf66cedbdb225d68e0eab6dd48aa0fd2
          docker pull ghcr.io/k3d-io/k3d-tools@sha256:c5ceb2b9e8ff2cf55917b0bee8bc9c54fe1483a16366b734117e2cfac1417bed
          docker tag ghcr.io/k3d-io/k3d-tools@sha256:c5ceb2b9e8ff2cf55917b0bee8bc9c54fe1483a16366b734117e2cfac1417bed ghcr.io/k3d-io/k3d-tools:5.8.3
          docker pull nicolaka/netshoot@sha256:47b907d662d139d1e2f22bfe14f4efca1e3f1feed283572f47c970c780c03b61
          docker pull public.ecr.aws/eks/aws-load-balancer-controller:v2.14.1@sha256:13abee6e31c2f25ee91f9ae91aabe4f5bcaf6a70eccd372b36835786d2e0813e
          docker pull public.ecr.aws/docker/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          go build -o bin/stackd ./cmd/stackd
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/stackd-elbv2-node ./cmd/stackd-elbv2-node
          python3 -m venv "$RUNNER_TEMP/ingress-venv"
          "$RUNNER_TEMP/ingress-venv/bin/pip" install -r examples/requirements.txt
      - name: Exercise upstream IRSA, healthy pod targets and actual ALB HTTP
        run: |
          "$RUNNER_TEMP/ingress-venv/bin/python" -B -P -m unittest discover -s scripts -p eks_lbc_smoke_test.py
          "$RUNNER_TEMP/ingress-venv/bin/python" scripts/eks_lbc_smoke.py \
            --binary bin/stackd --elbv2-node-executable bin/stackd-elbv2-node \
            --k3d bin/k3d --storage-reserve-gib 4 \
            --controller-image public.ecr.aws/eks/aws-load-balancer-controller:v2.14.1@sha256:13abee6e31c2f25ee91f9ae91aabe4f5bcaf6a70eccd372b36835786d2e0813e \
            --state-directory "$RUNNER_TEMP/ingress-private" \
            --output "$RUNNER_TEMP/ingress-result.json"
      - name: Retain sanitized ingress assertions only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-ingress
          path: ${{ runner.temp }}/ingress-result.json
          if-no-files-found: ignore
          retention-days: 7
