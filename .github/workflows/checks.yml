name: Focused checks

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - name: Check Go formatting without modifying source
        run: test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
      - name: Check release tooling contracts
        run: python3 -B -P -m unittest discover -s scripts -p release_test.py
      - name: Vet and lint controller and shared identity/time boundaries
        run: |
          go vet ./cmd/stackd ./clock ./iam/policy ./internal/identity ./compute/lambda/cmd/telemetry-buffer
          go tool staticcheck ./cmd/stackd ./clock ./iam/policy ./internal/identity ./compute/lambda/cmd/telemetry-buffer
      - name: Run focused identity/time policy tests
        run: go test -race -timeout 10m ./clock ./iam/policy ./internal/identity
      - name: Build native CLI and both static Linux telemetry helpers
        run: make build
      - name: Exercise focused deployment and encryption regressions
        run: |
          go test ./integration -timeout 10m -run '^(TestDefaultAccountIdentitySDK|TestCustomStorageRequiresAccountSelection|TestCloudFormationDeleteFirstReplacementRollback|TestCloudFormationRejectedExclusiveReplacementRestoresFreshNativeOwner|TestCloudFormationQueuePublicEndpoint|TestRESTResponseLifecycle|TestS3UpdateObjectEncryption.*|TestCloudFormationSecureDynamicReferencesNativePasswordReplay|TestCloudFormationSecretJSONKeyNativeCoercion|TestCloudFormationSecureResultAttributesRejectConsumption)$'
          go test ./storage ./storage/sqlite -timeout 5m -run '^(TestMemoryAccountSelection.*|TestSQLiteAccountSelection.*|TestCloudFormationSecureDynamicReferencePinMigration)$'
          go test ./internal/services/athena -timeout 5m
          go test -race ./internal/services/cloudformation -timeout 5m
          go test ./internal/services/rds ./storage/sqlite/rds ./cmd/terraformapisgen -timeout 5m
          go test -race ./internal/services/ec2 -timeout 5m -run '^TestEIPAttributesSDK'
          go test -race ./internal/integrations -timeout 5m -run '^TestAthenaManifestRecordsOnlySuccessfulCommittedObjects$'
          go test ./internal/services/glue -timeout 5m -run '^TestTableStatisticsDeletionNativeIdempotence$'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.9'
          terraform_wrapper: false
      - name: Exercise actual Terraform and CloudFormation applications
        run: |
          python3 -m venv "$RUNNER_TEMP/examples-venv"
          "$RUNNER_TEMP/examples-venv/bin/pip" install -r examples/requirements.txt
          mkdir -p "$RUNNER_TEMP/stackd-examples"
          "$RUNNER_TEMP/examples-venv/bin/python" examples/cloudformation/run.py --work-parent "$RUNNER_TEMP/stackd-examples"
          "$RUNNER_TEMP/examples-venv/bin/python" examples/terraform/run.py --work-parent "$RUNNER_TEMP/stackd-examples"
          "$RUNNER_TEMP/examples-venv/bin/python" examples/terraform-eip/run.py --work-parent "$RUNNER_TEMP/stackd-examples"
      - name: Retain example controller diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-controller-logs
          path: ${{ runner.temp }}/stackd-examples/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  generated:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - name: Read pinned GuardDuty catalog revision
        id: catalog
        run: echo "revision=$(jq -r .provenance.revision docs/guardduty-findings.json)" >> "$GITHUB_OUTPUT"
      - name: Fetch the exact catalog input (not runtime code)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: trustoncloud/aws-guardduty-findings-directory
          ref: ${{ steps.catalog.outputs.revision }}
          path: clones/aws-guardduty-findings-directory
          persist-credentials: false
      - name: Verify catalog input checksum
        run: |
          jq -r '"\(.provenance.source_sha256)  clones/aws-guardduty-findings-directory/findings.json"' docs/guardduty-findings.json | sha256sum --check -
      - name: Read pinned Terraform provider revision
        id: provider
        run: echo "revision=$(jq -r .provider.revision docs/terraform-provider-apis.json)" >> "$GITHUB_OUTPUT"
      - name: Fetch the exact Terraform provider source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: hashicorp/terraform-provider-aws
          ref: ${{ steps.provider.outputs.revision }}
          path: clones/terraform-provider-aws
          persist-credentials: false
      - name: Check retained and pinned-source generators
        run: |
          make generate-iam-check generate-oidc-check generate-simulation-check \
            generate-lambda-runtime-check generate-sql-check generate-mq-schema-check \
            generate-cloudformation-check generate-guardduty-findings-check \
            generate-terraform-apis-check
