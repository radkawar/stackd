---
$schema: "https://spec.openapis.org/oas/3.0/schema/2024-10-18#/definitions/Schema"
title: Array_of_Event
type: array
components:
  schemas:
    Event:
      title: Events for Telemetry API for schema version 2025-01-29
      type: object
      properties:
        time:
          type: string
      oneOf:
        - type: object
          properties:
            record:
              $ref: "#/components/schemas/PlatformInitStart"
            type:
              type: string
              const: platform.initStart
          required:
            - type
            - record
        - type: object
          properties:
            record:
              $ref: "#/components/schemas/PlatformInitRuntimeDone"
            type:
              type: string
              const: platform.initRuntimeDone
          required:
            - type
            - record
        - type: object
          properties:
            record:
              $ref: "#/components/schemas/PlatformInitReport"
            type:
              type: string
              const: platform.initReport
          required:
            - type
            - record
        - type: object
          properties:
            record:
              $ref: "#/components/schemas/PlatformRestoreStart"
            type:
              type: string
              const: platform.restoreStart
          required:
            - type
            - record
        - type: object
          properties:
            record:
              $ref: "#/components/schemas/PlatformRestoreRuntimeDone"
            type:
              type: string
              const: platform.restoreRuntimeDone
          required:
            - type
            - record
        - type: object
          properties:
            record:
              $ref: "#/components/schemas/PlatformRestoreReport"
            type:
              type: string
              const: platform.restoreReport
          required:
            - type
            - record
        - type: object
          properties:
            record:
              $ref: "#/components/schemas/PlatformStart"
            type:
              type: string
              const: platform.start
          required:
            - type
            - record
        - type: object
          properties:
            record:
              $ref: "#/components/schemas/PlatformRuntimeDone"
            type:
              type: string
              const: platform.runtimeDone
          required:
            - type
            - record
        - type: object
          properties:
            record:
              $ref: "#/components/schemas/PlatformReport"
            type:
              type: string
              const: platform.report
          required:
            - type
            - record
        - type: object
          properties:
            record:
              $ref: "#/components/schemas/PlatformExtension"
            type:
              type: string
              const: platform.extension
          required:
            - type
            - record
        - type: object
          properties:
            record:
              $ref: "#/components/schemas/PlatformTelemetrySubscription"
            type:
              type: string
              const: platform.telemetrySubscription
          required:
            - type
            - record
        - type: object
          properties:
            record:
              $ref: "#/components/schemas/PlatformLogsDropped"
            type:
              type: string
              const: platform.logsDropped
          required:
            - type
            - record
        - type: object
          properties:
            record: true
            type:
              type: string
              const: function
          required:
            - type
            - record
        - type: object
          properties:
            record: true
            type:
              type: string
              const: extension
          required:
            - type
            - record
      required:
        - time
    InitPhase:
      type: string
      enum:
        - init
        - invoke
    InitReportMetrics:
      type: object
      properties:
        durationMs:
          type: number
          format: double
      required:
        - durationMs
    InitType:
      type: string
      enum:
        - on-demand
        - provisioned-concurrency
        - snap-start
        - lambda-managed-instances
    PlatformExtension:
      type: object
      properties:
        errorType:
          type:
            - string
            - "null"
        events:
          type: array
          items:
            type: string
        name:
          type: string
        state:
          type: string
      required:
        - name
        - state
        - events
    PlatformInitReport:
      type: object
      properties:
        initializationType:
          $ref: "#/components/schemas/InitType"
        metrics:
          $ref: "#/components/schemas/InitReportMetrics"
        phase:
          $ref: "#/components/schemas/InitPhase"
        spans:
          type: array
          items:
            $ref: "#/components/schemas/Span"
        tracing:
          anyOf:
            - $ref: "#/components/schemas/TraceContext"
            - type: "null"
      anyOf:
        - oneOf:
            - type: object
              properties:
                status:
                  type: string
                  const: success
              required:
                - status
            - type: object
              properties:
                errorType:
                  type: string
                status:
                  type: string
                  const: error
              required:
                - status
                - errorType
            - type: object
              properties:
                errorType:
                  type: string
                status:
                  type: string
                  const: failure
              required:
                - status
                - errorType
            - type: object
              properties:
                status:
                  type: string
                  const: timeout
              required:
                - status
        - {}
      required:
        - initializationType
        - phase
        - metrics
    PlatformInitRuntimeDone:
      type: object
      properties:
        initializationType:
          $ref: "#/components/schemas/InitType"
        phase:
          $ref: "#/components/schemas/InitPhase"
        spans:
          type: array
          items:
            $ref: "#/components/schemas/Span"
        tracing:
          anyOf:
            - $ref: "#/components/schemas/TraceContext"
            - type: "null"
      oneOf:
        - type: object
          properties:
            status:
              type: string
              const: success
          required:
            - status
        - type: object
          properties:
            errorType:
              type: string
            status:
              type: string
              const: error
          required:
            - status
            - errorType
        - type: object
          properties:
            errorType:
              type: string
            status:
              type: string
              const: failure
          required:
            - status
            - errorType
        - type: object
          properties:
            status:
              type: string
              const: timeout
          required:
            - status
      required:
        - initializationType
        - phase
    PlatformInitStart:
      type: object
      properties:
        functionName:
          type: string
        functionVersion:
          type: string
        initializationType:
          $ref: "#/components/schemas/InitType"
        instanceId:
          type: string
        instanceMaxMemory:
          type: integer
          format: uint64
          minimum: 0
        phase:
          $ref: "#/components/schemas/InitPhase"
        runtimeVersion:
          type: string
        runtimeVersionArn:
          type: string
        tracing:
          anyOf:
            - $ref: "#/components/schemas/TraceContext"
            - type: "null"
      required:
        - initializationType
        - phase
    PlatformLogsDropped:
      type: object
      properties:
        droppedBytes:
          type: integer
          format: uint64
          minimum: 0
        droppedRecords:
          type: integer
          format: uint64
          minimum: 0
        reason:
          type: string
      required:
        - reason
        - droppedRecords
        - droppedBytes
    PlatformReport:
      type: object
      properties:
        metrics:
          $ref: "#/components/schemas/ReportMetrics"
        requestId:
          type: string
        spans:
          type: array
          items:
            $ref: "#/components/schemas/Span"
        tenantId:
          type:
            - string
            - "null"
        tracing:
          anyOf:
            - $ref: "#/components/schemas/TraceContext"
            - type: "null"
      anyOf:
        - oneOf:
            - type: object
              properties:
                status:
                  type: string
                  const: success
              required:
                - status
            - type: object
              properties:
                errorType:
                  type: string
                status:
                  type: string
                  const: error
              required:
                - status
                - errorType
            - type: object
              properties:
                errorType:
                  type: string
                status:
                  type: string
                  const: failure
              required:
                - status
                - errorType
            - type: object
              properties:
                status:
                  type: string
                  const: timeout
              required:
                - status
        - {}
      required:
        - requestId
        - metrics
    PlatformRestoreReport:
      type: object
      properties:
        metrics:
          $ref: "#/components/schemas/RestoreReportMetrics"
        spans:
          type: array
          items:
            $ref: "#/components/schemas/Span"
        tracing:
          anyOf:
            - $ref: "#/components/schemas/TraceContext"
            - type: "null"
      anyOf:
        - oneOf:
            - type: object
              properties:
                status:
                  type: string
                  const: success
              required:
                - status
            - type: object
              properties:
                errorType:
                  type: string
                status:
                  type: string
                  const: error
              required:
                - status
                - errorType
            - type: object
              properties:
                errorType:
                  type: string
                status:
                  type: string
                  const: failure
              required:
                - status
                - errorType
            - type: object
              properties:
                status:
                  type: string
                  const: timeout
              required:
                - status
        - {}
      required:
        - metrics
    PlatformRestoreRuntimeDone:
      type: object
      properties:
        spans:
          type: array
          items:
            $ref: "#/components/schemas/Span"
        tracing:
          anyOf:
            - $ref: "#/components/schemas/TraceContext"
            - type: "null"
      oneOf:
        - type: object
          properties:
            status:
              type: string
              const: success
          required:
            - status
        - type: object
          properties:
            errorType:
              type: string
            status:
              type: string
              const: error
          required:
            - status
            - errorType
        - type: object
          properties:
            errorType:
              type: string
            status:
              type: string
              const: failure
          required:
            - status
            - errorType
        - type: object
          properties:
            status:
              type: string
              const: timeout
          required:
            - status
    PlatformRestoreStart:
      type: object
      properties:
        functionName:
          type: string
        functionVersion:
          type: string
        instanceId:
          type: string
        instanceMaxMemory:
          type: integer
          format: uint64
          minimum: 0
        runtimeVersion:
          type: string
        runtimeVersionArn:
          type: string
        tracing:
          anyOf:
            - $ref: "#/components/schemas/TraceContext"
            - type: "null"
    PlatformRuntimeDone:
      type: object
      properties:
        metrics:
          anyOf:
            - $ref: "#/components/schemas/RuntimeDoneMetrics"
            - type: "null"
        requestId:
          type: string
        spans:
          type: array
          items:
            $ref: "#/components/schemas/Span"
        tenantId:
          type:
            - string
            - "null"
        tracing:
          anyOf:
            - $ref: "#/components/schemas/TraceContext"
            - type: "null"
      oneOf:
        - type: object
          properties:
            status:
              type: string
              const: success
          required:
            - status
        - type: object
          properties:
            errorType:
              type: string
            status:
              type: string
              const: error
          required:
            - status
            - errorType
        - type: object
          properties:
            errorType:
              type: string
            status:
              type: string
              const: failure
          required:
            - status
            - errorType
        - type: object
          properties:
            status:
              type: string
              const: timeout
          required:
            - status
      required:
        - requestId
    PlatformStart:
      type: object
      properties:
        functionArn:
          type:
            - string
            - "null"
        requestId:
          type: string
        tenantId:
          type:
            - string
            - "null"
        tracing:
          anyOf:
            - $ref: "#/components/schemas/TraceContext"
            - type: "null"
        version:
          type:
            - string
            - "null"
      required:
        - requestId
    PlatformTelemetrySubscription:
      type: object
      properties:
        name:
          type: string
        state:
          type: string
        types:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionEventType"
      required:
        - name
        - state
        - types
    ReportMetrics:
      type: object
      properties:
        billedDurationMs:
          type:
            - integer
            - "null"
          format: uint64
          minimum: 0
        billedRestoreDurationMs:
          type:
            - integer
            - "null"
          format: uint64
          minimum: 0
        durationMs:
          type: number
          format: double
        initDurationMs:
          type:
            - number
            - "null"
          format: double
        maxMemoryUsedMB:
          type:
            - integer
            - "null"
          format: uint64
          minimum: 0
        memorySizeMB:
          type:
            - integer
            - "null"
          format: uint64
          minimum: 0
        restoreDurationMs:
          type:
            - number
            - "null"
          format: double
      required:
        - durationMs
    RestoreReportMetrics:
      type: object
      properties:
        durationMs:
          type: number
          format: double
      required:
        - durationMs
    RuntimeDoneMetrics:
      type: object
      properties:
        durationMs:
          type: number
          format: double
        producedBytes:
          type:
            - integer
            - "null"
          format: uint64
          minimum: 0
      required:
        - durationMs
    Span:
      type: object
      properties:
        durationMs:
          type: number
          format: double
        name:
          type: string
        start:
          type: string
      required:
        - name
        - start
        - durationMs
    SubscriptionEventType:
      description: Log event types for the subsciption.
      oneOf:
        - description: Logs produced by the Lambda platform.
          type: string
          const: platform
        - description: Logs produced by the executed function.
          type: string
          const: function
        - description: Logs produced by the running extensions.
          type: string
          const: extension
    TraceContext:
      type: object
      properties:
        spanId:
          type:
            - string
            - "null"
        type:
          $ref: "#/components/schemas/TracingType"
        value:
          type: string
      required:
        - type
        - value
    TracingType:
      type: string
      enum:
        - X-Amzn-Trace-Id
items:
  $ref: "#/components/schemas/Event"

